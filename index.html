<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Quiz Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <div id="start-screen" class="screen active">
            <h1>QUIZ MASTER</h1>
            <p>Kiến thức là sức mạnh</p>
            <div class="input-group">
                <input type="text" id="username" placeholder="Nhập tên của bạn...">
            </div>
            <button class="btn" onclick="goToCategory()">Bắt đầu</button>
        </div>

        <div id="category-screen" class="screen">
            <h2>Chọn Chủ Đề</h2>
            <div class="category-list">
                <button class="btn-category" onclick="startGame('programming')">
                    <i class="fas fa-code"></i> Lập trình
                </button>
                <button class="btn-category" onclick="startGame('general')">
                    <i class="fas fa-globe"></i> Kiến thức chung
                </button>
                <button class="btn-category" onclick="startGame('science')">
                    <i class="fas fa-flask"></i> Khoa học
                </button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="header-game">
                <span id="question-counter">Câu: 1/10</span>
                <span id="score">Điểm: 0</span>
            </div>
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
            <h2 id="question-text">Câu hỏi sẽ hiện ở đây?</h2>
            <div class="answers-container" id="answers-container">
                </div>
        </div>

        <div id="result-screen" class="screen">
            <h2>Kết Thúc!</h2>
            <p>Điểm của bạn: <span id="final-score">0</span></p>
            
            <div class="leaderboard">
                <h3>🏆 Bảng Xếp Hạng 🏆</h3>
                <ul id="high-scores-list"></ul>
            </div>

            <div class="controls">
                <button class="btn" onclick="location.reload()">Chơi Lại</button>
            </div>
        </div>
    </div>

    <!-- <audio id="sound-correct" src="sounds/correct.mp3"></audio>
    <audio id="sound-wrong" src="sounds/wrong.mp3"></audio> -->

    <script src="script.js"></script>
</body>
</html>
