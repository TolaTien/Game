<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <div id="start-screen" class="screen active">
            <h1>QUIZ MASTER</h1>
            <p>Design by Tien dep trai</p>
            <div class="input-group">
                <input type="text" id="username" placeholder="Enter your name...">
            </div>
            <button class="btn" onclick="goToCategory()">Start now</button>
        </div>

        <div id="category-screen" class="screen">
            <h2>Chọn Chủ Đề</h2>
            <div class="category-list">
                <button class="btn-category" onclick="startGame('music')">
                    <i class="fas fa-music"></i> Âm nhạc
                </button>
                <button class="btn-category" onclick="startGame('game')">
                    <i class="fas fa-gamepad"></i> Game
                </button>
                <button class="btn-category" onclick="startGame('celeb')">
                    <i class="fas fa-star"></i> Nổi tiếng
                </button>
                <button class="btn-category" onclick="startGame('math')">
                    <i class="fas fa-calculator"></i> Toán học
                </button>
                <button class="btn-category" onclick="startGame('history')">
                    <i class="fas fa-landmark"></i> Lịch sử
                </button>
                <button class="btn-category" onclick="startGame('food')">
                    <i class="fas fa-utensils"></i> Ẩm thực
                </button>
                <button class="btn-category" onclick="startGame('geo')">
                    <i class="fas fa-globe-asia"></i> Địa lý
                </button>
                <button class="btn-category" onclick="startGame('sports')">
                    <i class="fas fa-futbol"></i> Thể thao
                </button>
                <button class="btn-category" onclick="startGame('science')">
                    <i class="fas fa-atom"></i> Khoa học
                </button>
                <button class="btn-category" onclick="startGame('tech')">
                    <i class="fas fa-laptop-code"></i> Công nghệ
                </button>
                <button class="btn-category" onclick="startGame('movies')">
                    <i class="fas fa-film"></i> Điện ảnh
                </button>
                <button class="btn-category" onclick="startGame('anime')">
                    <i class="fas fa-user-ninja"></i> Anime
                </button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="header-game">
                <span id="question-counter">Câu: 1/15</span>
                <span id="score">Điểm: 0</span>
            </div>
            
            <div class="timer-container">
                <span id="timer-text">⏱ 02:00</span>
                <div class="timer-bar-bg">
                    <div id="timer-progress"></div>
                </div>
            </div>

            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
            
            <div style="text-align: right; margin-bottom: 10px;">
                <button id="btn-hint" class="btn-hint" onclick="useHint()">
                    <i class="fas fa-lightbulb"></i> Gợi ý (<span id="hint-count">3</span>)
                </button>
            </div>

            <h2 id="question-text">Câu hỏi sẽ hiện ở đây?</h2>
            <div class="answers-container" id="answers-container">
            </div>
        </div>

        <div id="result-screen" class="screen">
            <i class="fas fa-trophy" style="font-size: 50px; color: gold; margin-bottom: 20px;"></i>
            <h2>Kết Thúc!</h2>
            <p>Điểm của bạn: <span id="final-score">0</span></p>
            
            <div class="leaderboard">
                <h3>🏆 Bảng Xếp Hạng 🏆</h3>
                <ul id="high-scores-list"></ul>
            </div>

            <div class="controls">
                <button class="btn" onclick="location.reload()">Chơi Lại</button>
            </div>
        </div>
    </div>

    <div id="feedback-modal" class="modal">
        <div class="modal-content">
            <div id="feedback-icon"></div>
            <h2 id="feedback-title">Tiêu đề</h2>
            <p id="feedback-text">Nội dung thông báo</p>
            <button class="btn" onclick="closeFeedback()">Tiếp tục <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

    <audio id="bg-music" src="music1.mp3" loop></audio> 
    <audio id="sound-correct" src="correct.mp3"></audio>
    <audio id="sound-wrong" src="wrong.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
